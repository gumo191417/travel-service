- id: refund_time
  category: refund_policy
  question: 退款多久到账？
  keywords: [退款, 到账, 多久, 几天, 退回]
  answer: 退款审核通过后一般 1-3 个工作日原路退回，具体到账时间以支付渠道为准。

- id: refund_condition
  category: refund_policy
  question: 什么情况可以申请退款？
  keywords: [退款, 条件, 能不能退, 可以退, 不可退]
  answer: 未使用且符合产品退改规则的订单可以申请退款；已使用、已过期或标注不可退的特价产品通常无法退款。

- id: refund_process
  category: refund_policy
  question: 怎么申请退款？
  keywords: [退款, 申请, 怎么退, 提交]
  answer: 在订单详情页选择对应明细提交退款申请，或联系客服提供订单号和退款原因。

- id: hotel_change
  category: change_policy
  question: 酒店可以改期吗？
  keywords: [酒店, 改期, 改时间, 换日期]
  answer: 需在入住前联系酒店或客服，按房型退改规则处理，可能产生差价。

- id: train_change
  category: change_policy
  question: 火车票怎么改签？
  keywords: [火车, 改签, 改签费, 车票]
  answer: 开车前可在订单中办理改签，按铁路规则执行，票价差额多退少补。

- id: flight_change
  category: change_policy
  question: 机票可以改签吗？
  keywords: [机票, 改签, 改期, 航班]
  answer: 按舱位对应的退改规则执行，特价舱位可能不支持改签或需收取手续费。

- id: scenic_change
  category: change_policy
  question: 景区门票可以改日期吗？
  keywords: [门票, 改期, 景区, 改日期]
  answer: 未使用的门票可按景点退改规则申请改期，部分特价票不支持改期。

- id: payment_timeout
  category: booking_rule
  question: 下单后多久需要付款？
  keywords: [付款, 支付, 多久, 超时, 取消]
  answer: 订单创建后请在 30 分钟内完成支付，超时订单会自动取消并释放库存。

- id: checkin_docs
  category: booking_rule
  question: 酒店入住需要什么证件？
  keywords: [入住, 证件, 身份证, 实名]
  answer: 入住人需携带本人有效身份证件，一人一证；未成年人入住按酒店规定执行。

- id: child_ticket
  category: booking_rule
  question: 儿童票怎么买？
  keywords: [儿童, 小孩, 儿童票, 孩子]
  answer: 儿童票按景区、交通或酒店的具体规则购买，下单时选择儿童票种并填写儿童信息。

- id: flight_airport_time
  category: travel_notice
  question: 坐飞机要提前多久到机场？
  keywords: [飞机, 机场, 提前, 多久, 值机]
  answer: 国内航班建议提前 2 小时到达机场，国际航班建议提前 3 小时。

- id: scenic_entry
  category: travel_notice
  question: 景区门票怎么入园？
  keywords: [景区, 入园, 二维码, 门票, 预约]
  answer: 凭下单时填写的身份证或订单二维码入园，部分景区需要提前预约。

- id: transfer_wait
  category: travel_notice
  question: 接送司机会等多久？
  keywords: [接送, 司机, 等待, 接机, 超时]
  answer: 接机服务通常包含航班落地后 60 分钟免费等待，超时按服务规则收取等待费。

- id: invoice
  category: general_travel
  question: 可以开发票吗？
  keywords: [发票, 开票, 报销]
  answer: 订单完成后可在订单详情申请电子发票，开票信息以实际支付金额为准。